name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 3.0.0. Secrets cannot be tested in an `if:` directly, so they are lifted
    # into env here and the release steps test env instead. All of them are
    # optional: with none set, this workflow does exactly what it always did
    # and skips only the signed Play bundle. PUBLISHING.md step 3.
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Pinned with the AGP version in build.gradle: AGP 8.13.2 needs
          # Gradle 8.14 or newer. There is no wrapper in this repo, so the
          # two have to be changed together.
          gradle-version: '8.14.5'

      # Every action here is on a major that runs Node 24. Node 20 reached
      # end of life on the runners, which forced all four onto Node 24
      # anyway with a deprecation warning on every build — running there on
      # purpose, on versions that declare it, is the difference between a
      # supported configuration and one the runner is propping up.
      #
      # packages stays named explicitly even though v4 no longer needs it.
      # v3 defaulted to "tools platform-tools"; `tools` — the obsolete SDK
      # Tools package, superseded by cmdline-tools years ago — was removed
      # from Google's repository, so once the runner image moved to
      # cmdline-tools 16.0 that default failed every build on every branch
      # with "Failed to find package 'tools'", before Gradle ran at all.
      # v4 drops `tools` from its own default, so this line is now
      # belt-and-braces rather than the fix — and that is the point: what
      # this build installs should not depend on an action's default, which
      # is what went wrong in the first place.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Everything the build needs, named explicitly rather than inherited
      # from whatever the runner image happens to preinstall. android-36 was
      # coming from the image before; that is the same class of assumption
      # that `tools` turned out to be, and sdkmanager is a no-op when a
      # package is already present.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle :core:test --no-daemon

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Verify signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          FINGERPRINT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}' | tr 'a-f' 'A-F' \
            | sed 's/\(..\)/\1:/g; s/:$//')
          EXPECTED=$(cat app/expected-signer.txt | tr -d '\n')
          echo "Built with signer:    $FINGERPRINT"
          echo "Expected signer:      $EXPECTED"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::Signer fingerprint mismatch — this build would break updates for every installed copy."
            exit 1
          fi

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      # 3.0.0. The Play Store upload: a release bundle signed with YOUR
      # upload key. The key only ever exists on this runner's temp disk for
      # the length of the job; it is never committed and never uploaded.
      - name: Signed Play bundle
        id: bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -lh app/build/outputs/bundle/release/*.aab
          echo "aab=app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"

      - name: No Play bundle (secrets not set)
        if: env.UPLOAD_KEYSTORE_BASE64 == ''
        run: |
          echo "::notice::Skipped the signed Play bundle: add UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD as repository secrets (PUBLISHING.md step 3). The debug APK below is unaffected."

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            ${{ steps.bundle.outputs.aab }} \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}. Debug APK signer: $(cat app/expected-signer.txt). versionCode: $((${{ github.run_number }} + 1000)). ${{ steps.bundle.outputs.aab && 'app-release.aab is signed with your upload key and ready for Play Console.' || 'No Play bundle: signing secrets not set.' }}"
