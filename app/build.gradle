plugins { id 'com.android.application' }

// ---- 3.0.0: release signing inputs -----------------------------------------
// None of these are in git. Each comes from the environment (GitHub Secrets
// in CI) or from ~/.gradle/gradle.properties on your own machine, never from
// this repo's gradle.properties. PUBLISHING.md says where each one comes from.
def input = { String name ->
    (System.getenv(name) ?: project.findProperty(name) ?: "").toString().trim()
}
def uploadStoreFile = input('UPLOAD_STORE_FILE')
def canSignUpload = !uploadStoreFile.isEmpty() && file(uploadStoreFile).exists()

android {
    namespace 'com.retro.launcher'
    compileSdk 36

    defaultConfig {
        // 3.0.0: the Play Store identity, permanent once published. Only the
        // install ID changed — the Java package is still com.retro.launcher,
        // which is why `namespace` above did not move. A 2.x sideloaded copy
        // is a different app to Android and installs alongside this one.
        applicationId "com.swasim.minretrolauncher"
        // Stays at 26. Nothing here needs a higher floor, and raising it
        // drops devices for nothing.
        minSdk 26
        targetSdk 36
        // Frozen at 1 through V6, which is half of why "App not installed"
        // appeared on every update: the package manager saw every build as
        // the same version. CI's run number is monotonic; the +1000 offset
        // puts even the first V7 build far above the installed 1 regardless
        // of what the run number happens to be. A local build gets exactly
        // 1000, which is fine — local builds are not what gets updated over.
        versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger() + 1000
        versionName "3.0.2"
        vectorDrawables.useSupportLibrary false
    }

    // resConfigs moved out of defaultConfig and was deprecated in AGP 8.x.
    androidResources {
        localeFilters += ['en']
    }

    // The other half of "App not installed". CI runs on a fresh
    // ubuntu-latest runner, which generates a brand-new ~/.gradle/debug.keystore
    // on every run, so consecutive builds were signed by different keys and
    // Android refuses an update whose certificate does not match. This
    // keystore is committed so every build — CI or local — shares one
    // signature. A debug keystore is a well-known key pair by design and
    // carries no security value; see BUILD.md.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // 3.0.0. The upload key. Play rejects anything signed with the debug
        // key above, and this one is the only real secret in the project, so
        // it is configured only when the environment supplies it. With Play
        // App Signing, Google re-signs for distribution; this key only proves
        // an upload came from you.
        if (canSignUpload) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword input('UPLOAD_STORE_PASSWORD')
                keyAlias input('UPLOAD_KEY_ALIAS')
                keyPassword input('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        release {
            // Unsigned when no upload key is supplied: an unsigned bundle is
            // obviously not uploadable, where a debug-signed one looks fine
            // until Play Console rejects it at the last step.
            signingConfig canSignUpload ? signingConfigs.upload : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation project(':core')

    // The project's first external dependency, added in V8. Contained
    // entirely to ShizukuLock.java, the one file in the app that imports
    // a Shizuku type.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Shizuku's own artifacts pull this in only as `implementation`, so it
    // never reaches this module's compile classpath transitively even
    // though it's on the runtime classpath. ShizukuLockService.java imports
    // androidx.annotation.Keep directly, so it needs to be a direct
    // dependency here too. Pinned to the exact version Shizuku already
    // resolves to avoid a second copy on the classpath.
    implementation 'androidx.annotation:annotation:1.3.0'
}

// An unsigned release bundle is obviously not uploadable, so it is refused
// here rather than at the last step in Play Console.
tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!canSignUpload) {
            throw new GradleException("No upload key (UPLOAD_STORE_FILE). Play rejects " +
                    "unsigned and debug-signed bundles. See PUBLISHING.md step 3.")
        }
    }
}
